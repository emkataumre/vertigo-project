name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-typecheck:
    name: App TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

  app-tests:
    name: App Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test -- --ci --coverage

  edge-functions-tests:
    name: Edge Functions Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check identify
        run: deno check --config supabase/functions/identify/deno.json supabase/functions/identify/index.ts

      - name: Type-check classify-text
        run: deno check --config supabase/functions/classify-text/deno.json supabase/functions/classify-text/index.ts

      - name: Test identify
        run: deno test --config supabase/functions/identify/deno.json supabase/functions/identify/index.test.ts --allow-net --allow-env

      - name: Test classify-text
        run: deno test --config supabase/functions/classify-text/deno.json supabase/functions/classify-text/index.test.ts --allow-net --allow-env

  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [app-typecheck, app-tests, edge-functions-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy identify
        run: supabase functions deploy identify --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy classify-text
        run: supabase functions deploy classify-text --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
